<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1012">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Abs Before Ramadan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a living sky over a masjid skyline holds the day ring; below it the chain, the windows, the daily checks. Dark first; the sky follows Pakistan time. */
:root{
  --bg:#0F1012; --s1:#17191C; --s2:#202328; --ink:#F1EEE8; --muted:#8F9297; --line:#2A2E33;
  --h1:#FFC24A; --h2:#FF6B35; --h3:#E8437A;
  --late:#FFB020; --miss:#FF5A5F; --miss-bg:#3A1E22; --ok:#43D18C;
  --f-d:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-b:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#ECEEF1; --s1:#FFFFFF; --s2:#E2E5EA; --ink:#15171A; --muted:#5E636B; --line:#D3D7DD;
  --h1:#C98200; --h2:#E0501A; --h3:#C2265F; --late:#B87700; --miss:#D1363C; --miss-bg:#F8DEDF; --ok:#16935A; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ECEEF1; --s1:#FFFFFF; --s2:#E2E5EA; --ink:#15171A; --muted:#5E636B; --line:#D3D7DD;
  --h1:#C98200; --h2:#E0501A; --h3:#C2265F; --late:#B87700; --miss:#D1363C; --miss-bg:#F8DEDF; --ok:#16935A; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px calc(104px + env(safe-area-inset-bottom,0px))}
h2{margin:30px 4px 10px;font:800 17px var(--f-d);letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h2 em{font:600 12px var(--f-b);letter-spacing:0;text-transform:none;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--h2);outline-offset:2px}
.disp{font-family:var(--f-d);font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---- hero sky: its own world, always a night-to-dusk palette with white type ---- */
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero.gl .stars,.hero.gl .orb{display:none}
.hero{position:relative;margin:-12px -12px 0;border-radius:0 0 30px 30px;overflow:hidden;color:#FFF8F0;padding:16px 16px 0;background:linear-gradient(180deg,var(--k1),var(--k2) 55%,var(--k3));isolation:isolate}
.sky-night{--k1:#070A1C;--k2:#121735;--k3:#262347}
.sky-dawn{--k1:#141A3C;--k2:#5A3A66;--k3:#E38A5C}
.sky-day{--k1:#173F68;--k2:#2F6D9A;--k3:#7FB0C9}
.sky-gold{--k1:#2A2E57;--k2:#8C5466;--k3:#E59A55}
.sky-dusk{--k1:#121231;--k2:#5C2F55;--k3:#D3603E}
.stars{position:absolute;inset:0;z-index:-1;opacity:0}
.sky-night .stars{opacity:1}
.sky-dawn .stars,.sky-dusk .stars{opacity:.45}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.orb{position:absolute;z-index:-1;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-50%)}
.orb.sun{background:radial-gradient(circle,#FFF3C4,#FFC24A 55%,rgba(255,150,60,0) 72%);width:72px;height:72px}
.orb.moon{background:#F4F1E6;box-shadow:inset -10px -4px 0 #C9C4B3,0 0 24px rgba(244,241,230,.35)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.logo{font:800 34px/.85 var(--f-d);letter-spacing:.01em}
.logo span{display:block;font:600 12.5px var(--f-b);opacity:.85;margin-top:5px}
.logo em{display:block;font:600 12px var(--f-b);font-style:normal;margin-top:7px;letter-spacing:.02em;opacity:.95}
.logo em b{font:800 19px/1 var(--f-d);color:#FFC24A}
.top{text-shadow:0 1px 10px rgba(0,0,0,.4)}
.clock{text-align:right;font-size:12px;opacity:.85}
.clock b{display:block;font:800 26px/1 var(--f-d)}
.ringwrap{position:relative;width:min(300px,78vw);margin:2px auto 0}
.ring{width:100%;height:auto;display:block;overflow:visible}
.ring .seg{fill:none;stroke-width:8}
.ring .sal{stroke-width:17}
.ring .ontime,.ring .cur{filter:drop-shadow(0 0 5px rgba(255,107,53,.85))}
.ring .todo{stroke:rgba(255,255,255,.14)}
.ring .ontime{stroke:url(#heat)}
.ring .late,.ring .qaza{stroke:#FFB020}
.ring .home{stroke:#FFD9A0}
.ring .open,.ring .qazaable{stroke:#FF5A5F;opacity:.6;stroke-dasharray:3 4}
.ring .missed{stroke:#FF5A5F;opacity:.55}
.ring .cur{stroke-width:22;stroke:url(#heat);animation:burn 1.6s ease-in-out infinite}
.ring .draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw .5s cubic-bezier(.3,.7,.3,1) var(--d) forwards}
.ring .cur.draw{animation:draw .5s cubic-bezier(.3,.7,.3,1) var(--d) forwards,burn 1.6s ease-in-out calc(var(--d) + .5s) infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes burn{50%{opacity:.6}}
.ring .hand{stroke:#fff;stroke-width:2;stroke-linecap:round}
#fx{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);pointer-events:none}
.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.center::before{content:"";position:absolute;inset:16%;border-radius:50%;background:rgba(8,10,26,.3);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.09)}
.center>div{position:relative;text-align:center;width:60%;display:grid;gap:3px;justify-items:center;pointer-events:auto;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.center .k{font:700 11px var(--f-b);letter-spacing:.08em;color:#FFC24A}
.center .w{font:800 30px/1 var(--f-d);text-wrap:balance}
.center .t{font-size:12.5px;opacity:.85}
.go{margin-top:8px;border:0;border-radius:999px;padding:10px 24px;font:800 15px var(--f-b);color:#1A0F08;background:linear-gradient(100deg,#FFC24A,#FF6B35 55%,#E8437A);box-shadow:0 8px 26px -8px #FF6B35}
.go:active{transform:scale(.96)}
.score{display:flex;justify-content:center;gap:20px;position:relative;width:max-content;max-width:100%;margin:8px auto 6px;padding:8px 18px;border-radius:18px;background:rgba(8,10,26,.3);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.09)}
.score div{text-align:center;font-size:11.5px;opacity:.85}
.score b{display:block;font:800 26px/1 var(--f-d)}
.faces{overflow:hidden;margin:0 -16px;touch-action:pan-y}
.track{display:flex;width:200%;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.fc{width:50%;padding:0 16px;display:grid;align-content:center}
#jface{justify-items:center;text-align:center}
.jk{font:700 11px var(--f-b);letter-spacing:.08em;color:#FFC24A}
.jt{font-size:12.5px;opacity:.85}
.torso{width:min(250px,66vw);height:auto;display:block;margin-top:2px}
.dots{display:flex;justify-content:center;gap:8px;position:relative;margin:2px 0 -4px}
.dots button{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:#FFF8F0;opacity:.35}
.dots button.on{opacity:1}
.skyline{display:block;width:calc(100% + 32px);margin:0 -16px;height:auto}
.skyline .b{fill:var(--bg)}
.skyline .lit{fill:#FFC24A;opacity:0}
.sky-night .skyline .lit,.sky-dusk .skyline .lit{opacity:.85}

/* catch-up */
.catch{margin-top:12px;border:1px solid var(--miss);background:var(--miss-bg);border-radius:16px;padding:12px 14px}
.catch p{margin:0 0 6px;font-weight:700;font-size:14px}
.catch .it{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--miss) 30%,transparent)}
.catch .it span{font-size:14px;font-weight:600;min-width:0}
.catch .it small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.catch .it div{display:flex;gap:6px;flex-shrink:0}
.sm{border:1px solid var(--line);background:var(--s1);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:700}
.sm.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* chain */
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.streak{display:flex;align-items:baseline;gap:10px}
.streak .n{font:800 48px/.9 var(--f-d);background:linear-gradient(90deg,var(--h1),var(--h2),var(--h3));-webkit-background-clip:text;background-clip:text;color:transparent}
.streak .l{font-weight:700}
.streak .l small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.gwrap{overflow-x:auto;margin-top:10px}
.gsvg{display:block;width:100%;min-width:300px;height:auto}
.gsvg text{fill:var(--muted);font:600 9px var(--f-b)}
.l0{fill:var(--s2)} .l1{fill:color-mix(in srgb,var(--h1) 40%,var(--s2))} .l2{fill:var(--h1)} .l3{fill:var(--h2)} .l4{fill:var(--h3)}
.lx{fill:var(--miss-bg);stroke:var(--miss);stroke-width:.8;stroke-opacity:.6}
.fut{fill:color-mix(in srgb,var(--muted) 45%,var(--s2))}
.sh{fill:var(--bg);opacity:.74;pointer-events:none}
.rm{fill:none;stroke:var(--h1);stroke-width:.9;opacity:.75}
.bk{fill:none;stroke:var(--muted);stroke-width:.9;stroke-dasharray:2 2.4}
.today{stroke:var(--ink);stroke-width:1.8;animation:burn 1.6s ease-in-out infinite}
.leg{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:3px}
.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* window board */
.board{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row .tm{font:800 20px/1 var(--f-d)}
.row .tm small{display:block;font:600 10.5px var(--f-b);color:var(--muted);margin-top:3px}
.row .lb{min-width:0;display:grid;gap:1px}
.row .lb b{display:block;font-weight:700;font-size:14.5px}
.row .lb b svg{color:var(--muted);vertical-align:-3px;margin-right:6px}
.row .lb b i{margin-left:5px;vertical-align:1px}
.row.salah .lb b svg{color:var(--h1)}
.row .lb span{font-size:11.5px;color:var(--muted)}
.wt{font:700 10.5px var(--f-b);font-style:normal;color:var(--h1);border:1px solid color-mix(in srgb,var(--h1) 40%,transparent);border-radius:5px;padding:0 4px}
.row.past .lb b,.row.past .tm{opacity:.6}
.row.cur{background:linear-gradient(90deg,color-mix(in srgb,var(--h2) 20%,transparent),transparent 80%)}
.row.cur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--h1),var(--h2),var(--h3))}
.row.cur .tm{color:var(--h2)}
.mk{min-width:74px;border-radius:9px;border:1px solid var(--line);background:transparent;padding:7px 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.mk.ontime{background:color-mix(in srgb,var(--h2) 22%,transparent);color:var(--h2);border-color:transparent}
.mk.late,.mk.qaza{background:color-mix(in srgb,var(--late) 18%,transparent);color:var(--late);border-color:transparent}
.mk.home{background:color-mix(in srgb,var(--h1) 14%,transparent);color:var(--h1);border-color:transparent}
.mk.missed{background:var(--miss-bg);color:var(--miss);border-color:transparent}
.mk.open,.mk.qazaable{border-color:var(--miss);color:var(--miss)}
.mk.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mk:disabled{cursor:default}

/* checks */
.grid{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd b{font-weight:700;display:flex;align-items:center;gap:7px}
.hd span{color:var(--muted);font-size:11.5px;text-align:right}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;font-weight:700;font-size:12.5px;display:grid;justify-items:center;gap:4px;color:var(--muted)}
.chip.on{background:linear-gradient(140deg,var(--h1),var(--h2));color:#1A0F08;border-color:transparent}
.chip:active,.btn:active{transform:scale(.96)}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--s2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--h2)}
.seg button.bad.on{box-shadow:inset 0 -2px 0 var(--miss);color:var(--miss)}
.field{display:flex;align-items:center;gap:8px;margin-top:8px}
.field input{width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:8px 10px;font:800 26px var(--f-d)}
.field em{font-style:normal;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--s1);border-radius:11px;padding:10px 14px;font-weight:700;font-size:13.5px}
.btn.on{background:linear-gradient(100deg,var(--h1),var(--h2));color:#1A0F08;border-color:transparent}
.btn.warn{background:var(--miss-bg);color:var(--miss);border-color:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.hint b{color:var(--ink)}
.ok-t{color:var(--ok)} .late-t{color:var(--late)} .miss-t{color:var(--miss)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mgrid input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:7px 9px;font:800 22px var(--f-d);color:var(--ink)}
.ci{border-color:var(--h2)}.ci.done{border-color:var(--ok)}.ci.void{border-color:var(--miss);background:var(--miss-bg)}
.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt th{font-size:10.5px;font-weight:600;color:var(--muted);text-align:right;padding:4px 3px}
.mt th:first-child,.mt td:first-child{text-align:left}
.mt td{text-align:right;padding:7px 3px;border-top:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt td:first-child{font-weight:600;white-space:normal}
.log{margin-top:12px}.log summary{font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.up{color:var(--ok)}.dn{color:var(--miss)}
.db .dbh{display:flex;align-items:center;gap:14px}.gr{font:800 54px/.8 var(--f-d)}
.dbs{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:13.5px}.dbs>b{font-size:12px;color:var(--muted);font-weight:700}
.dbr{display:flex;justify-content:space-between;gap:10px}.dbr span{min-width:0}.dbr b{text-align:right}.fx{border-top-color:var(--h2)}
.f4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f4 span{padding:11px 10px;border-radius:12px;background:var(--s2);font-weight:700;font-size:13px;color:var(--muted)}
.f4 span.y{background:linear-gradient(140deg,var(--h1),var(--h2));color:#1A0F08}
.f4 span small{display:block;font-weight:600;font-size:11px;opacity:.75}
.tw{border-color:var(--miss)}.tw .btn{margin-top:8px}
.strict{font:700 10px var(--f-b);font-style:normal;color:var(--miss);border:1px solid var(--miss);border-radius:5px;padding:0 4px}

/* tabs */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 28px));background:color-mix(in srgb,var(--s1) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:999px;display:flex;padding:5px;z-index:5;box-shadow:0 14px 34px -14px rgba(0,0,0,.7)}
nav.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:11px 0;font-weight:700;font-size:13px;color:var(--muted);transition:color .2s}
nav.tabs button.on{color:#1A0F08;background:linear-gradient(100deg,#FFC24A,#FF6B35 60%,#E8437A);box-shadow:0 6px 18px -8px #FF6B35}

/* trends + settings */
.title{font:800 34px/1 var(--f-d);margin:6px 4px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile span{display:block;font-size:11.5px;color:var(--muted)}
.tile b{font:800 30px var(--f-d)}
.tile b small{font:600 12px var(--f-b);color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
svg.chart text{fill:var(--muted);font:600 10px var(--f-b)}
.tl{stroke:var(--ink);stroke-dasharray:3 3;opacity:.5}
.ax{stroke:var(--line)}
table.wk{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px}
table.wk th{font-weight:600;font-size:10.5px;color:var(--muted);padding:4px 2px;text-align:center}
table.wk th:first-child,table.wk td:first-child{text-align:left;white-space:nowrap}
table.wk td{text-align:center;padding:5px 2px;border-top:1px solid var(--line)}
.dot{display:inline-block;width:18px;height:18px;border-radius:6px;background:var(--s2);vertical-align:middle}
.dot.y{background:linear-gradient(135deg,var(--h1),var(--h2))}
.dot.p{background:transparent;border:1.5px dashed var(--line)}
.dot.m{background:var(--miss-bg);border:1.5px solid var(--miss)}
.dot.n{background:transparent}
.sal{display:grid;grid-template-columns:62px 1fr 44px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
.sal:first-child{border-top:0}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--s2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wedit{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.wedit:first-child{border-top:0;padding-top:0}
.wedit .r{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end}
label{font-size:11px;font-weight:600;color:var(--muted);display:grid;gap:4px;min-width:0}
.set input,.set select,.wedit input,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px;font-size:14px;color:var(--ink)}
.days{display:flex;gap:4px}
.days button{flex:1;border:1px solid var(--line);background:transparent;border-radius:7px;padding:5px 0;font-size:11px;font-weight:700;color:var(--muted)}
.days button.on{background:var(--s2);color:var(--ink);border-color:var(--h2)}
.set{display:grid;gap:10px}
.split{display:grid;grid-template-columns:40px 1fr 60px;gap:8px;align-items:center}
.split span{font-weight:700;font-size:13px}

/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet[hidden]{display:none}
.shc{width:100%;max-width:520px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.shc .k{font:800 28px/1 var(--f-d)}
.shc .q{font-weight:600;color:var(--muted);font-size:13px}
.shc input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font:800 32px var(--f-d);color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:11px;font-weight:700;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.abf{filter:drop-shadow(0 0 5px rgba(255,107,53,.85));animation:burn 2.6s ease-in-out infinite}
.wv{animation:wv 1.3s linear infinite}
@keyframes wv{to{transform:translateX(14px)}}
.in>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.in>:nth-child(2){animation-delay:.05s}.in>:nth-child(3){animation-delay:.1s}.in>:nth-child(n+4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ring .draw{stroke-dashoffset:0}}
</style>

<script>
const KEY='abr.v1',TZ='Asia/Karachi',RAMADAN='2027-02-08',END='2027-03-07',START_W=71.3,GOAL_W=59;
const SES={push:'Push',pull:'Pull',legs:'Legs',recovery:'Active recovery',shoulders:'Shoulders',arms:'Arms',rest:'Rest'};
const STRICT=['legs','recovery'],LIFTS=['push','pull','legs','recovery','shoulders','arms'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PLAN=[['2026-11-10',71.3],['2026-11-17',69.8],['2026-11-24',68.8],['2026-12-01',67.8],['2026-12-08',66.9],['2026-12-15',66.1],['2026-12-22',65.3],['2026-12-29',66.1],['2027-01-05',64.6],['2027-01-12',63.9],['2027-01-19',63.2],['2027-01-26',62.5],['2027-02-02',61.8],['2027-02-07',61.3],['2027-02-14',60.8],['2027-02-21',60.3],['2027-02-28',59.8],['2027-03-07',59.3]];
const ALL=[0,1,2,3,4,5,6],WK=[1,2,3,4,5];
/* rule: grace = markable until 1 h after close; strict = on time only. masjid: only | pref */
const COACH_TXT="Bhai, I owe you the truth. When you asked last time, I said I had started the cut. I hadn't. I'm at {kg} kg and just had {n} red days in a row on my tracker. I want to hire you for the cut till Eid, target 59, abs by April. I need someone to hold me to it. Can we start this week?";
function defaults(){return{startDate:'2026-11-10',targets:{sleep:7,steps:11000,study:3,wk:5,abs:2},v:4,coach:{phone:'',text:COACH_TXT,sent:null},
  windows:[
   {id:'fajr',label:'Fajr',start:'05:10',end:'05:45',kind:'salah',w:3,rule:'grace',masjid:'pref',days:ALL,qaza:[0]},
   {id:'juma',label:'Juma',start:'13:00',end:'13:45',kind:'salah',w:3,rule:'strict',masjid:'only',days:[5]},
   {id:'zuhr',label:'Zuhr',start:'13:15',end:'13:45',kind:'salah',w:3,rule:'grace',masjid:'pref',days:[0,1,2,3,4,6]},
   {id:'asr',label:'Asr',start:'16:00',end:'16:30',kind:'salah',w:3,rule:'grace',masjid:'pref',days:ALL},
   {id:'maghrib',label:'Maghrib',start:'17:00',end:'17:25',kind:'salah',w:3,rule:'grace',masjid:'pref',days:ALL},
   {id:'isha',label:'Isha',start:'19:00',end:'19:30',kind:'salah',w:3,rule:'strict',masjid:'only',days:ALL},
   {id:'wend',label:'Stop work',start:'19:30',end:'19:45',kind:'work',w:1,rule:'grace',days:WK},
   {id:'bed',label:'Phone down, into bed',start:'21:15',end:'21:30',kind:'sleep',w:2,rule:'grace',days:[0,1,2,3,4]}],
  split:{1:'push',2:'pull',3:'legs',4:'recovery',5:'shoulders',6:'arms',0:'rest'},absDays:[3,6],
  measures:[{id:'sh',name:'Shoulders',short:'Shoulders',dir:'up'},{id:'ch',name:'Chest',short:'Chest',dir:'up'},{id:'rb',name:'Right bicep, flexed',short:'R bicep',dir:'up'},{id:'lb',name:'Left bicep, flexed',short:'L bicep',dir:'up'},
   {id:'wa',name:'Waist',short:'Waist',dir:'down'},{id:'hi',name:'Hips',short:'Hips',dir:'down'},{id:'rt',name:'Right thigh',short:'R thigh',dir:'down'},{id:'lt',name:'Left thigh',short:'L thigh',dir:'down'}],checkinBy:'09:00',
  overrides:{}}}

let S;
function load(){let r=null;try{r=localStorage.getItem(KEY)}catch(e){}try{S=r?JSON.parse(r):null}catch(e){S=null}if(!S||!S.settings)S={settings:defaults(),days:{}};const D=defaults();migrate(D);if(!S.settings.measures||S.settings.measures.some(m=>['bir','bif','stom'].includes(m.id)))S.settings.measures=D.measures;S.settings.checkinBy=S.settings.checkinBy||D.checkinBy}
/* v3: the restart. Day 1 moves to 10 Nov and the schedule is replaced; everything logged before stays in storage, outside the journey. Windows you added yourself are kept */
function migrate(D){const g=S.settings;
  if(g.v<3){for(const k in S.days){const sl=S.days[k].slots||{};for(const id in sl){const w=g.windows.find(x=>x.id===id);if(w&&sl[id].t!=null&&!sl[id].end)sl[id].end=w.end}delete S.days[k].stepAt}
    g.windows=D.windows.concat(g.windows.filter(w=>/^w[0-9a-z]{6,}$/.test(w.id)));g.startDate=D.startDate;g.targets.study=g.targets.study||3;try{localStorage.removeItem('abr.rev')}catch(e){}}
  /* v4: eight markers, workouts any day (5 a week), the fitness four and the coach tripwire */
  if(g.v<4){const drop=['study1','gym2','nap','work','jleave','gym','study'];g.windows=g.windows.filter(w=>!drop.includes(w.id));
    g.targets.wk=g.targets.wk||5;g.targets.abs=g.targets.abs||2;g.coach=g.coach||D.coach;g.v=4;save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---- Pakistan time, whatever the phone's zone ---- */
const fPK=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function pk(){const p={};for(const x of fPK.formatToParts(new Date()))p[x.type]=x.value;return{key:`${p.year}-${p.month}-${p.day}`,min:+p.hour*60+ +p.minute}}
const pad=n=>String(n).padStart(2,'0');
const pK=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const kOf=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const add=(k,n)=>{const d=pK(k);d.setUTCDate(d.getUTCDate()+n);return kOf(d)};
const diff=(a,b)=>Math.round((pK(b)-pK(a))/864e5);
const dow=k=>pK(k).getUTCDay();
const sd=k=>{const d=pK(k);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const fd=k=>DOW[dow(k)]+', '+sd(k);
const tk=()=>pk().key,now=()=>pk().min;
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const hm=t=>{const[h,m]=t.split(':').map(Number);return{t:(h%12||12)+':'+pad(m),ap:h<12?'am':'pm'}};
const ms=m=>(Math.floor(m/60)%12||12)+':'+pad(m%60)+(m<720?' am':' pm');
const left=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
const kf=n=>n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;

const day=k=>S.days[k]||(S.days[k]={slots:{}}),peek=k=>S.days[k];
const plan=k=>S.settings.overrides[k]||S.settings.split[dow(k)];
const absP=k=>S.settings.overrides[k]?S.settings.overrides[k]==='legs':S.settings.absDays.includes(dow(k));
const phase=k=>k<S.settings.startDate?'pre-cut':k>='2026-12-22'&&k<='2026-12-28'?'deficit break':k>=RAMADAN&&k<=END?'ramadan':k>END?'done':'cut';
function planW(k){if(k<=PLAN[0][0])return PLAN[0][1];for(let i=1;i<PLAN.length;i++)if(k<=PLAN[i][0]){const[a,x]=PLAN[i-1],[b,y]=PLAN[i];return x+(y-x)*diff(a,k)/diff(a,b)}return GOAL_W}
const winsFor=k=>S.settings.windows.filter(w=>w.days.includes(dow(k))&&(!w.from||k>=w.from)&&(!w.until||k<=w.until)).sort((a,b)=>toMin(a.start)-toMin(b.start));
const lockAt=w=>toMin(w.end)+(w.rule==='strict'?0:60);

/* window state: ontime late home(prayed elsewhere) qaza missed | open(closed, still markable) qazaable todo */
function st(k,w){const s=peek(k)?.slots?.[w.id],T=tk(),e=toMin(s?.end||w.end);
  if(k<S.settings.startDate)return'todo';
  if(s){if(s.how==='skip')return'missed';if(s.how==='qaza')return'qaza';if(s.how==='else')return'home';return s.t<=e?'ontime':'late'}
  if(k>T)return'todo';if(k<T)return'missed';
  const n=now();if(n<=e)return'todo';if(n<=lockAt(w))return'open';
  if(w.qaza?.includes(dow(k)))return'qazaable';return'missed'}
const PTS={ontime:1,late:.6,home:.5,qaza:.5};
const closed=k=>k<tk()||(k===tk()&&now()>=22*60);

/* Thursday check-in: weight, every measurement, photos taken, all by checkinBy. Missing it zeroes the day. */
const isCI=k=>dow(k)===4&&k>=S.settings.startDate;
function ciDone(k){const d=peek(k);return!!d&&d.weight!=null&&!!d.photos&&S.settings.measures.every(m=>d.meas?.[m.id]!=null)}
function ciStamp(k){const d=day(k);if(ciDone(k)){if(d.ci==null)d.ci=k===tk()?now():9999}else delete d.ci}
const ciOk=k=>(peek(k)?.ci??9999)<=toMin(S.settings.checkinBy);
const ciVoid=k=>isCI(k)&&!ciOk(k)&&(k<tk()||(k===tk()&&now()>toMin(S.settings.checkinBy)));
/* day points, item by item: weighted windows, meals, snack, water, session, abs, sleep, steps, study */
function parts(k){const d=peek(k)||{slots:{}},T=S.settings.targets,c=closed(k),L=[],P=(id,name,p,e)=>L.push({id,name,p,e});
  for(const w of winsFor(k))P(w.id,w.label,w.w,(PTS[st(k,w)]||0)*w.w);
  P('meals','Clean meals',3,['bf','lu','di'].filter(x=>d.meals?.[x]).length);
  P('snack','Snack',1,d.snack==='over'?-1:d.snack?1:0);
  P('water','Water',1.5,d.water==='4'?1.5:d.water==='35'?1:c?-1:0);
  const tw=wkNeed(k,x=>x.trained,T.wk||5),ab=wkNeed(k,x=>x.abs,T.abs||2);
  if(d.trained||tw.req)P('train','Workout',2,d.trained?2:0);
  if(d.abs||ab.req)P('abs','Abs',1,d.abs?1:0);
  P('steps','Steps',1.5,stepF(d.steps||0)*1.5);
  P('studyh','Study hours',3,Math.min((d.study||0)/(T.study||3),1)*3);
  return L}
function score(k){if(ciVoid(k))return{e:0,p:1,f:0,void:true};let e=0,p=0;for(const x of parts(k)){p+=x.p;e+=x.e}e=Math.max(0,e);return{e,p,f:e/p}}
/* workouts and abs: any day, weekly target. A day only requires one when the week can no longer reach the target without it */
const wkStart=k=>add(k,-((dow(k)+6)%7));
function wkNeed(k,f,t){const s0=S.settings.startDate,ws=wkStart(k),we=add(ws,6),a=ws<s0?s0:ws,tg=Math.round(t*(diff(a,we)+1)/7),left=diff(k,we)+1;
  let c=0;for(let x=a;x<k;x=add(x,1))if(f(peek(x)||{}))c++;return{c,tg,left,req:tg-c>0&&tg-c>=left}}
const stepF=n=>{const t=S.settings.targets.steps;return n>=t?1:n<8000?0:(n-8000)/(t-8000)};
/* the fitness four. Red day = 3 or more missed. Meals get a 2-day ramp from the start date */
function four(k){const d=peek(k)||{},T=S.settings.targets;return{steps:(d.steps||0)>=T.steps,gym:!!d.trained||!wkNeed(k,x=>x.trained,T.wk||5).req,meals:k<add(S.settings.startDate,2)||['bf','lu','di'].every(x=>d.meals?.[x]),water:d.water==='35'||d.water==='4'}}
const red=k=>k>=S.settings.startDate&&closed(k)&&Object.values(four(k)).filter(Boolean).length<=1;
function redRun(){let k=closed(tk())?tk():add(tk(),-1),n=0;while(red(k)){n++;k=add(k,-1)}return{n,from:add(k,1)}}
const lvl=f=>f<.35?'x':f<.55?1:f<.7?2:f<.85?3:4;
function streak(){const T=tk();let k=add(T,-1),n=0;while(k>=S.settings.startDate){if(!peek(k)||score(k).f<.6)break;n++;k=add(k,-1)}if(peek(T)&&score(T).f>=.6)n++;return n}

/* ---------- today ---------- */
let tab='today',vk=tk(),range=7,first=true,armed=false;
const app=document.getElementById('app');
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));tab==='today'?today():tab==='trends'?trends():settings()}
function cur(){const k=tk(),n=now(),ws=winsFor(k);const o=ws.find(w=>n>=toMin(w.start)&&n<=toMin(w.end)&&st(k,w)==='todo');if(o)return{w:o,m:'now'};const x=ws.find(w=>toMin(w.start)>n&&st(k,w)==='todo');return x?{w:x,m:'next'}:null}
const skyPhase=n=>n<300||n>=1170?'night':n<420?'dawn':n<960?'day':n<1035?'gold':'dusk';
function arc(r,a0,a1){const P=a=>[160+r*Math.cos(a),160+r*Math.sin(a)],[x0,y0]=P(a0),[x1,y1]=P(a1);return`M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`}
let emitAt=null;
function ring(k,c){const ws=winsFor(k),n=ws.length,R=124,step=Math.PI*2/n,g=.05;emitAt=null;
  let s=`<svg class="ring" viewBox="0 0 320 320" aria-hidden="true"><defs><linearGradient id="heat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC24A"/><stop offset=".55" stop-color="#FF6B35"/><stop offset="1" stop-color="#E8437A"/></linearGradient></defs>`;
  ws.forEach((w,i)=>{const a0=-Math.PI/2+i*step+g/2,a1=a0+step-g,x=st(k,w),isC=c&&c.m==='now'&&c.w.id===w.id,m=(a0+a1)/2;
    if(isC)emitAt=[160+R*Math.cos(m),160+R*Math.sin(m),m];
    s+=`<path class="seg ${x}${w.kind==='salah'?' sal':''}${isC?' cur':''}${first?' draw':''}" style="--l:${(R*(a1-a0)).toFixed(0)};--d:${(i*.05).toFixed(2)}s" d="${arc(R,a0,a1)}"/>`;
});
  if(k===tk()&&n){const t=now();let i=ws.findIndex(w=>t<=toMin(w.end));if(i<0)i=n;let f=0;if(i<n){const a=toMin(ws[i].start),b=toMin(ws[i].end);f=t<a?0:Math.min(1,(t-a)/Math.max(1,b-a))}
    const a=-Math.PI/2+(i+f)*step;s+=`<line class="hand" x1="${160+(R-19)*Math.cos(a)}" y1="${160+(R-19)*Math.sin(a)}" x2="${160+(R+19)*Math.cos(a)}" y2="${160+(R+19)*Math.sin(a)}"/>`}
  return s+'</svg>'}
/* masjid skyline: domes, minarets, a few lit windows at night */
const SKY=(()=>{const B=74;let p=`M0 ${B}V62H360V${B}Z`,l='';
  const dome=(x,r,h)=>{p+=`M${x-r} 62V${62-h}A${r} ${r*1.1} 0 0 1 ${x+r} ${62-h}V62ZM${x-1} ${62-h-r*1.1}l1-7 1 7Z`};
  const mn=(x,h)=>{p+=`M${x-3} 62V${62-h}h-1.5v-3h9v3H${x+3}V62ZM${x-3} ${62-h-3}l3-9 3 9Z`;l+=`<rect class="lit" x="${x-1}" y="${62-h+8}" width="2" height="3"/>`};
  mn(28,40);dome(70,22,10);dome(106,12,8);mn(140,48);dome(190,30,14);dome(232,14,8);mn(262,44);dome(305,18,9);mn(342,34);
  [[62,52],[78,52],[184,48],[196,48],[300,54]].forEach(([x,y])=>l+=`<rect class="lit" x="${x}" y="${y}" width="3" height="4" rx="1"/>`);
  return`<svg class="skyline" viewBox="0 0 360 ${B}" preserveAspectRatio="none" aria-hidden="true"><path class="b" d="${p}"/>${l}</svg>`})();
const STARS=(()=>{let s='';for(let i=0;i<28;i++)s+=`<i style="left:${(i*37.3)%100}%;top:${(i*53.7)%62}%;animation-delay:${(i%7)*.4}s"></i>`;return`<div class="stars">${s}</div>`})();
function orb(n){if(n>=330&&n<1110){const f=(n-330)/780;return`<div class="orb sun" style="left:${8+f*84}%;top:${62-Math.sin(f*Math.PI)*48}%"></div>`}
  const f=((n<330?n+1440:n)-1110)/660;return`<div class="orb moon" style="left:${88-f*76}%;top:${42-Math.sin(f*Math.PI)*28}%"></div>`}

function today(){const k=vk,T=tk(),isT=k===T,pre=k<S.settings.startDate,d=pre?{slots:{}}:day(k),n=now(),c=isT&&!pre?cur():null,ws=winsFor(k),sc=score(k),wn=diff(S.settings.startDate,k);
  const tw=wkNeed(k,x=>x.trained,S.settings.targets.wk||5),ab=wkNeed(k,x=>x.abs,S.settings.targets.abs||2),done=ws.filter(w=>PTS[st(k,w)]).length,toR=diff(T,RAMADAN),sn=isT?n:720,nn=(1-mph(Date.now()))*SYN,mo=nn<=toR+1?Math.floor((toR+1-nn)/SYN)+1:0;skyMs=isT?Date.now():pK(k).getTime()+252e5;
  let h=`<section id="hero" class="hero sky-${skyPhase(sn)}${gl?' gl':''}">${STARS}${orb(sn)}<div class="top"><div class="logo">ABS<span>before Ramadan</span><em>${toR>0?`<b>${toR}</b> days · <b>${mo}</b> new moon${mo===1?'':'s'}`:'Ramadan Mubarak'}</em></div>

   <div class="tile"><span>average study</span><b>${avg(SD)==null?'–':avg(SD).toFixed(1)}<small> / ${T.study} h</small></b></div>
   <div class="tile"><span>days at step target</span><b>${lg.filter(k=>(S.days[k].steps||0)>=T.steps).length}<small> / ${lg.length}</small></b></div></div>`;
  h+=wcard(ks)+mtable()+`<h2>Day score</h2><div class="card">${bars(ks,sc,60,v=>Math.round(v))}</div>`;
  const C=[['ontime','var(--h2)','masjid, on time'],['late','var(--late)','late'],['home','var(--h1)','home'],['qaza','#B38BFA','qaza'],['missed','var(--miss)','missed']];
  h+=`<h2>Salah</h2><div class="card">`;
  for(const id of['fajr','zuhr','juma','asr','maghrib','isha']){const w=S.settings.windows.find(x=>x.id===id);if(!w)continue;const cnt={};let n=0;
    for(const k of ks){if(!w.days.includes(dow(k)))continue;const s=st(k,w);cnt[s]=(cnt[s]||0)+1;if(!['todo','open','qazaable'].includes(s))n++}
    h+=`<div class="sal"><span>${esc(w.label)}</span><div class="stack">${n?C.map(([s,c])=>`<i style="width:${(cnt[s]||0)/n*100}%;background:${c}"></i>`).join(''):''}</div><span class="disp" style="text-align:right;font-size:18px">${cnt.ontime||0}/${n}</span></div>`}
  h+=`<div class="legend">${C.map(([,c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div></div>`;
  h+=`<h2>Training by week</h2><div class="card">${tgrid(ks)}</div><h2>Study</h2><div class="card">${bars(ks,SD,T.study,v=>v.toFixed(1)+'h')}</div><h2>Steps</h2><div class="card">${bars(ks,ST,T.steps,v=>kf(Math.round(v)))}</div><h2>Sleep</h2><div class="card">${bars(ks,SL,T.sleep,v=>v.toFixed(0)+'h')}</div>`;
  app.innerHTML=h}
function bars(ks,vals,tg,fmt){let lab=ks,v=vals;if(ks.length>42){lab=[];v=[];for(let i=0;i<ks.length;i+=7){lab.push(ks[i]);v.push(avg(vals.slice(i,i+7)))}}
  if(v.every(x=>x==null))return'<p class="hint">Nothing logged in this range yet.</p>';
  const W=340,H=140,pl=34,pr=6,pt=10,pb=20,cw=W-pl-pr,ch=H-pt-pb,mx=Math.max(tg*1.25,...v.filter(x=>x!=null)),y=x=>pt+ch-x/mx*ch,bw=cw/v.length,gp=Math.min(4,bw*.25);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily values against target"><defs><linearGradient id="bh" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--h1)"/><stop offset="1" stop-color="var(--h3)"/></linearGradient></defs><line class="ax" x1="${pl}" x2="${W-pr}" y1="${pt+ch}" y2="${pt+ch}"/>`;
  v.forEach((x,i)=>{const X=pl+i*bw+gp/2,w=Math.max(1,bw-gp);if(x==null){s+=`<rect x="${X}" y="${pt+ch-2}" width="${w}" height="2" fill="var(--line)"/>`;return}
    s+=`<rect x="${X}" y="${y(x)}" width="${w}" height="${pt+ch-y(x)}" rx="${Math.min(3,w/3)}" fill="${x>=tg?'url(#bh)':'var(--s2)'}"${x>=tg?'':' stroke="var(--muted)" stroke-width=".6"'}><title>${sd(lab[i])}: ${fmt(x)}</title></rect>`});
  return s+`<line class="tl" x1="${pl}" x2="${W-pr}" y1="${y(tg)}" y2="${y(tg)}"/><text x="${pl-4}" y="${y(tg)+4}" text-anchor="end">${fmt(tg)}</text><text x="${pl-4}" y="${pt+ch+4}" text-anchor="end">0</text><text x="${pl}" y="${H-4}">${sd(lab[0])}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${sd(lab[lab.length-1])}</text></svg>${ks.length>42?'<div class="hint">weekly averages</div>':''}`}
function wcard(ks){const T=tk(),lo=ks.length&&range!=='all'?ks[0]:PLAN[0][0],h0=range==='all'||!ks.length?END:ks[ks.length-1],hi=h0>lo?h0:add(lo,1);
  const pts=Object.keys(S.days).filter(k=>k>=lo&&k<=hi&&S.days[k].weight).sort().map(k=>[k,S.days[k].weight]);
  const W=340,H=160,pl=34,pr=10,pt=12,pb=20,cw=W-pl-pr,ch=H-pt-pb,sp=diff(lo,hi),pp=[];for(let i=0;i<=sp;i+=Math.max(1,Math.round(sp/40)))pp.push([add(lo,i),planW(add(lo,i))]);pp.push([hi,planW(hi)]);
  const all=[...pp,...pts].map(p=>p[1]),mn=Math.floor(Math.min(...all)-.5),mx=Math.ceil(Math.max(...all)+.5),X=k=>pl+diff(lo,k)/sp*cw,Y=w=>pt+ch-(w-mn)/(mx-mn)*ch,P=a=>a.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('');
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight against plan">`;[mn,(mn+mx)/2,mx].forEach(g=>s+=`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${Y(g)}" y2="${Y(g)}"/><text x="${pl-4}" y="${Y(g)+4}" text-anchor="end">${+g.toFixed(1)}</text>`);
  s+=`<path d="${P(pp)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;const av=pts.map(p=>[p[0],wAvg(p[0]).a]);pts.forEach(p=>s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.5" fill="var(--h2)" opacity=".55"><title>${sd(p[0])}: ${p[1]} kg</title></circle>`);if(av.length>1)s+=`<path d="${P(av)}" fill="none" stroke="var(--h2)" stroke-width="2.5"/>`;
  if(T>=lo&&T<=hi)s+=`<line x1="${X(T)}" x2="${X(T)}" y1="${pt}" y2="${pt+ch}" stroke="var(--h2)" opacity=".35"/>`;
  s+=`<text x="${pl}" y="${H-4}">${sd(lo)}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${sd(hi)}</text></svg>`;const l=pts[pts.length-1];
  return`<h2>Weight vs plan</h2><div class="card">${s}<div class="legend"><span><i style="background:var(--h2)"></i>7-day average, dots daily</span><span><i style="background:var(--muted)"></i>plan: 61 by Ramadan, 59 by Eid</span></div><div class="hint">${l?`7-day average ${wAvg(l[0]).a.toFixed(1)} kg on ${sd(l[0])}, plan ${planW(l[0]).toFixed(1)}${wh(wAvg(l[0]).a,planW(l[0]))}`:'No weigh-ins yet. Weigh every morning.'}</div></div>`}
/* body: weight + measurements. Latest value, change vs each earlier Thursday, and the full dated log */
function mtable(){const rows=[{id:'_w',name:'Body weight',short:'Weight',dir:'down',u:'kg'},...S.settings.measures];
  const val=(k,r)=>{const d=S.days[k];return r.id==='_w'?d.weight??null:d.meas?.[r.id]??null};
  const ks=Object.keys(S.days).filter(k=>dow(k)===4&&k>=S.settings.startDate&&rows.some(r=>val(k,r)!=null)).sort();
  let h=`<h2>Measurements <em>Thursday check-ins, cm</em></h2><div class="card">`;
  if(!ks.length)return h+`<p class="hint" style="margin:0">First check-in: ${fd(add(S.settings.startDate,(4-dow(S.settings.startDate)+7)%7))}, by ${hm(S.settings.checkinBy).t} am.</p></div>`;
  const G=ks[ks.length-1],cols=[1,2,3,4].map(w=>add(G,-7*w)).filter(c=>c>=add(S.settings.startDate,-6));
  const at=(r,lim)=>{for(let i=ks.length-1;i>=0;i--)if(ks[i]<=lim&&val(ks[i],r)!=null)return val(ks[i],r);return null};
  h+=`<div style="overflow-x:auto"><table class="mt"><thead><tr><th>stat</th><th>${sd(G)}</th>${cols.map(c=>`<th>vs ${sd(c)}</th>`).join('')}</tr></thead><tbody>`;
  for(const r of rows){const L=val(G,r);h+=`<tr><td>${esc(r.name)}</td><td>${L??'–'}</td>`;
    for(const c of cols){const P=at(r,c);if(L==null||P==null){h+='<td>–</td>';continue}const d=+(L-P).toFixed(1),good=r.dir==='up'?d>0:d<0;h+=`<td class="${d===0?'':good?'up':'dn'}">${d>0?'+':''}${d}</td>`}h+='</tr>'}
  h+=`</tbody></table></div><div class="legend"><span><i style="background:var(--ok)"></i>toward your goal</span><span><i style="background:var(--miss)"></i>away from it</span><span>weight in kg</span></div>`;
  h+=`<details class="log"><summary>Full log by date</summary><div style="overflow-x:auto"><table class="mt"><thead><tr><th>date</th>${rows.map(r=>`<th>${esc(r.short)}</th>`).join('')}</tr></thead><tbody>${[...ks].reverse().map(k=>`<tr><td style="white-space:nowrap">${sd(k)}</td>${rows.map(r=>`<td>${val(k,r)??'–'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details></div>`;
  return h}
function tgrid(ks){const T=tk(),TT=S.settings.targets,wks=[];for(let w=wkStart(ks[0]);w<=ks[ks.length-1];w=add(w,7))wks.push(w);
  let h=`<div style="overflow-x:auto"><table class="wk"><thead><tr><th>week of</th><th>workouts</th><th>legs</th><th>abs</th><th>red days</th></tr></thead><tbody>`;
  for(const w of wks){const ds=[...Array(7)].map((_,i)=>add(w,i)).filter(k=>k>=S.settings.startDate);if(!ds.length)continue;
    const n=ds.length,tg=Math.round((TT.wk||5)*n/7),ta=Math.round((TT.abs||2)*n/7),c=ds.filter(k=>peek(k)?.trained).length,a=ds.filter(k=>peek(k)?.abs).length,lg=ds.some(k=>peek(k)?.ses==='legs'),r=ds.filter(red).length,past=add(w,6)<T,col=(x,t)=>x>=t?'color:var(--h2)':past?'color:var(--miss)':'';
    h+=`<tr><td>${sd(w)}</td><td style="font-weight:700;${col(c,tg)}">${c}/${tg}</td><td><span class="dot ${lg?'y':past?'m':'p'}"></span></td><td style="font-weight:700;${col(a,ta)}">${a}/${ta}</td><td style="font-weight:700;${r?'color:var(--miss)':''}">${r}</td></tr>`}
  return h+`</tbody></table></div><div class="legend"><span><i style="background:var(--h2)"></i>target hit</span><span><i style="background:var(--miss-bg);outline:1.5px solid var(--miss)"></i>missed</span><span>legs: at least once a week</span></div>`}

/* ---------- settings ---------- */
function settings(){const s=S.settings,T=s.targets;let h=`<div class="title">Settings</div><h2>Windows <em>Pakistan time</em></h2><div class="card">`;
  [...s.windows].filter(w=>!w.until||w.until>=tk()).sort((a,b)=>toMin(a.start)-toMin(b.start)).forEach(w=>{h+=`<div class="wedit" data-wid="${w.id}"><label>name<input id="wl-${w.id}" data-f="label" value="${esc(w.label)}"></label>
   <div class="r"><label>opens<input id="ws-${w.id}" data-f="start" type="time" value="${w.start}"></label><label>closes<input id="we-${w.id}" data-f="end" type="time" value="${w.end}"></label>
   <button class="x" data-del="${w.id}" aria-label="Delete ${esc(w.label)}">×</button></div>
   <div class="days">${[1,2,3,4,5,6,0].map(i=>`<button class="${w.days.includes(i)?'on':''}" data-day="${w.id}" data-dw="${i}">${DOW[i].slice(0,2)}</button>`).join('')}</div>
   <div class="hint" style="margin:0">×${w.w} points, ${w.rule==='strict'?'on time only':'markable up to 1 hour after close'}${w.masjid==='only'?', masjid only':w.masjid==='pref'?', masjid preferred':''}${w.qaza?', Sunday qaza allowed':''}${w.from?`, from ${sd(w.from)}`:''}${w.until?`, until ${sd(w.until)}`:''}</div></div>`});

  <h2>Targets</h2><div class="card set"><div class="two"><label>sleep (h)<input id="t-sleep" data-t="sleep" type="number" step="0.25" value="${T.sleep}"></label><label>steps<input id="t-steps" data-t="steps" type="number" step="500" value="${T.steps}"></label><label>study (h)<input id="t-study" data-t="study" type="number" step="0.25" value="${T.study||3}"></label></div></div>
  <h2>Training</h2><div class="card set"><div class="two"><label>workouts a week<input id="t-wk" data-t="wk" type="number" step="1" min="1" max="7" value="${T.wk||5}"></label><label>abs a week<input id="t-abs" data-t="abs" type="number" step="1" min="0" max="7" value="${T.abs||2}"></label></div>
   <div class="hint" style="margin:0">Any day, any split. A workout only becomes required when the week can't reach the target without it.</div><label>cut start<input id="startDate" type="date" value="${s.startDate}"></label></div>

   <div class="hint" style="margin:0">Two red days in a row puts a one-tap button on Today. The number stays on this phone.</div></div>
  <h2>Thursday measurements</h2><div class="card set">${s.measures.map(m=>`<div class="split" data-mid="${m.id}" style="grid-template-columns:1fr 92px 34px"><input id="mn-${m.id}" data-mf="name" value="${esc(m.name)}"><button class="sm" data-mdir="${m.id}">${m.dir==='up'?'goal: grow':'goal: shrink'}</button><button class="x" data-mdel="${m.id}" aria-label="Remove ${esc(m.name)}">×</button></div>`).join('')}
   <div class="btns"><button class="btn" data-madd>Add measurement</button></div><label>check-in deadline<input id="ciby" type="time" value="${s.checkinBy}"></label></div>

   <label>restore<textarea id="imp" placeholder="Paste a backup here"></textarea></label><div class="btns"><button class="btn" data-restore>Restore</button><input id="impf" type="file" accept=".json,application/json" style="font-size:12px;max-width:100%"></div>
   <div class="btns"><button class="btn warn" data-reset>${armed?'Tap again to erase everything':'Erase all data'}</button></div></div>`;

/* ---------- journey: torso that slims while six abs fill. Full at a 75 average over the 90 days from 10 Nov to 7 Feb ---------- */
const JEND='2027-02-07',JF=()=>diff(S.settings.startDate,JEND)+1,RDAYS=diff(RAMADAN,END)+1;let face=0;
function jSum(a,b,upto){let s=0;for(let k=a;k<=b&&k<=upto;k=add(k,1))if(peek(k))s+=score(k).f;return s}
function jT(upto){return{c:Math.min(1,jSum(S.settings.startDate,JEND,upto)/(JF()*.75)),r:Math.min(1,jSum(RAMADAN,END,upto)/(RDAYS*.75)),upto}}
function spl(p){const n=p.length,g=i=>p[Math.max(0,Math.min(n-1,i))];let d='';for(let i=0;i<n-1;i++){const a=g(i-1),b=g(i),c=g(i+1),e=g(i+2);d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`}return d}
function torso(t){const C=190,f=1-t,W=58+16*f,L=15*f,B=312,ln='#6A6964';
  const side=s=>[[C+s*20,22],[C+s*21,42],[C+s*62,58],[C+s*100,70],[C+s*116,96],[C+s*110,124],[C+s*86,140],[C+s*84,176],[C+s*(75+3*f),222],[C+s*W,262],[C+s*(W+L),294],[C+s*(W+2),B]];
  const l=side(-1),r=side(1).reverse();let g=`<path d="M${l[0][0]} ${l[0][1]}${spl(l)} L${r[0][0]} ${r[0][1]}${spl(r)}Z" fill="url(#bod)" stroke="#5F5E5A"/>`,df='<linearGradient id="molt" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E8437A"/><stop offset=".5" stop-color="#FF6B35"/><stop offset="1" stop-color="#FFC24A"/></linearGradient><radialGradient id="bod" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#3B3B42"/><stop offset="1" stop-color="#202024"/></radialGradient>';
  [-1,1].forEach(s=>{const x=k=>C+s*k;
   g+=`<path d="M${x(98)} 74C${x(92)} 96 ${x(94)} 116 ${x(104)} 128" fill="none" stroke="${ln}" opacity="${(.4+.6*t).toFixed(2)}"/><path d="M${x(86)} 140C${x(80)} ${170+12*f} ${x(40)} ${182+12*f} ${x(5)} ${166+8*f}" fill="none" stroke="${ln}" stroke-width="1.6"/><path d="M${x(W-2)} 232C${x(W-6)} 252 ${x(W-6)} 272 ${x(W-10)} 296" fill="none" stroke="${ln}" opacity="${Math.max(0,t*1.5-.5).toFixed(2)}"/>`;
   [[0,186,24,28],[1,218,26,30],[2,252,27,32]].forEach(([q,y,w,h])=>{y+=5*f;const lo=s>0?C+4:C-4-w,hi=lo+w,i=q*2+(s>0?1:0),fl=Math.max(0,Math.min(1,t*6-i));
    const p=`M${lo+7} ${y}L${hi-7} ${y}Q${hi} ${y} ${hi} ${y+8}L${hi} ${y+h-8}Q${hi} ${y+h} ${hi-7} ${y+h}L${lo+7} ${y+h}Q${lo} ${y+h} ${lo} ${y+h-8}L${lo} ${y+8}Q${lo} ${y} ${lo+7} ${y}Z`;
    df+=`<clipPath id="jab${i}"><path d="${p}"/></clipPath>`;g+=`<path d="${p}" fill="#252528" stroke="${ln}" opacity="${(.3+.7*t).toFixed(2)}"/>`;
    if(fl>=1)g+=`<path class="abf" d="${p}" fill="url(#molt)"/>`;else if(fl>0)g+=`<g clip-path="url(#jab${i})"><path class="wv" d="M${lo-16} ${(y+h*(1-fl)+1.5).toFixed(1)}${'q3.5 -3 7 0t7 0'.repeat(5)}V${y+h+2}H${lo-16}Z" fill="url(#molt)" opacity=".9"/></g>`})});
  g+=`<ellipse cx="${C}" cy="${268+4*f}" rx="${(58*f+1).toFixed(1)}" ry="${(26*f+1).toFixed(1)}" fill="#303036" opacity="${(.85*f).toFixed(2)}"/><ellipse cx="${C}" cy="${296+3*f}" rx="3" ry="4.5" fill="#141416"/><rect x="${C-W-4}" y="${B-2}" width="${2*W+8}" height="30" rx="4" fill="#141416" stroke="${ln}"/>`;
  return`<svg class="torso" viewBox="60 10 260 335" aria-hidden="true"><defs>${df}</defs>${g}</svg>`}
function crescent(r){return`<svg viewBox="0 0 60 60" width="46" height="46" aria-hidden="true" style="position:absolute;right:10px;top:4px"><defs><clipPath id="cres"><path d="M38 6a24 24 0 1 0 16 38A20 20 0 1 1 38 6z"/></clipPath></defs><path d="M38 6a24 24 0 1 0 16 38A20 20 0 1 1 38 6z" fill="#2A2A2E" stroke="#5F5E5A"/><rect clip-path="url(#cres)" x="0" y="${(60*(1-r)).toFixed(1)}" width="60" height="60" fill="#FFC24A"/></svg>`}
function jFace(j){const T=tk(),dn=Math.max(0,Math.min(JF(),diff(S.settings.startDate,j.upto<T?j.upto:T)+1)),ab=Math.min(6,Math.floor(j.c*6)),pc=Math.round((j.c*6-ab)*100),ram=T>=RAMADAN;
  const line=j.c>=1?'all six filled':S.settings.startDate>T?`starts ${fd(S.settings.startDate)}`:`day ${dn} of ${JF()}, ab ${ab+1} at ${pc}%`;
  return`<span class="jk">${ram?'RAMADAN PHASE':'THE JOURNEY'}</span><span class="jt" id="jline">${line}${ram?`, Ramadan ${Math.round(j.r*100)}%`:''}</span><div style="position:relative">${torso(j.c)}${ram?crescent(j.r):''}</div>`}
function setFace(i){face=i;const tr=document.getElementById('track');if(tr)tr.style.transform=`translateX(${-50*i}%)`;document.querySelectorAll('.dots button').forEach(b=>b.classList.toggle('on',+b.dataset.face===i))}
/* first open of the day: show the journey, pour yesterday's points in, then slide to today */
function reveal(){const T=tk();let seen=null;try{seen=localStorage.getItem('abr.rev')}catch(e){}
  if(seen===T||T<=S.settings.startDate)return;try{localStorage.setItem('abr.rev',T)}catch(e){}
  const a=jT(add(T,-2)),b=jT(add(T,-1));setFace(1);let i=0;const N=RM?1:24;
  const step=()=>{i++;const k=i/N,j={c:a.c+(b.c-a.c)*k,r:a.r+(b.r-a.r)*k,upto:add(T,-1)},el=document.getElementById('jface');if(el)el.innerHTML=jFace(j);
    if(i<N)setTimeout(step,30);else{if(Math.floor(b.c*6)>Math.floor(a.c*6))try{navigator.vibrate?.([20,50,40])}catch(e){}setTimeout(()=>setFace(0),1300)}};setTimeout(step,500)}
let px=null;app.addEventListener('pointerdown',e=>{px=e.target.closest('.faces')?e.clientX:null});
app.addEventListener('pointerup',e=>{if(px==null)return;const dx=e.clientX-px;px=null;if(Math.abs(dx)>40)setFace(dx<0?1:0)});
setInterval(()=>{if(tab==='today'&&sheet.hidden&&!document.activeElement?.matches('input'))render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='today'){vk=tk();render()}});
addEventListener('resize',()=>{if(tab==='today')fxBind()});
load();skyInit();render();reveal();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
